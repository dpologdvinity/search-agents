[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "search-agents"
version = "0.1.0"
description = "Search agents for puzzles and games, from classic search to learned guidance"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
train = ["torch>=2.4", "matplotlib>=3.8"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["npuzzle", "connect4", "checkers", "routes", "game2048", "sudoku", "server", "lightsout", "blackjack", "battleship", "pacman", "warehouse", "endgame", "sokoban", "wordle", "poker", "minesweeper", "hexgame"]

[tool.setuptools.package-data]
npuzzle = ["data/*.npz", "data/*.json"]
connect4 = ["data/*.npz"]
game2048 = ["data/*.npz"]
endgame = ["data/*.npz"]
wordle = ["data/*.txt"]
poker = ["data/*.json"]
sudoku = ["puzzles.txt"]
pacman = ["data/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E731",  # small named lambdas are used deliberately for priority functions
    "B905",  # zip(strict=) everywhere adds noise; lengths are checked where it matters
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]  # package re-exports
"tests/*" = ["E402"]        # imports after pytest.importorskip
