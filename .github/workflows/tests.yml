name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        # Serving and test dependencies only; tests that need torch skip themselves.
        run: pip install "numpy>=1.26" "fastapi>=0.115" "uvicorn[standard]>=0.30" "httpx>=0.27" "pytest>=8" "ruff>=0.6"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
